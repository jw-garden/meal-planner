<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>냉장고 식단표</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2d6a4f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="식단표">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f5f5f0;
    color: #222;
    min-height: 100vh;
  }

  header {
    background: #2d6a4f;
    color: #fff;
    padding: 20px 16px 16px;
    text-align: center;
  }
  header h1 { font-size: 1.4rem; font-weight: 700; }
  header p { font-size: 0.85rem; opacity: 0.8; margin-top: 4px; }

  /* 상단 탭 */
  .main-tabs {
    display: flex; background: #1b4332;
    max-width: 700px; margin: 0 auto;
  }
  .main-tab {
    flex: 1; padding: 11px 0; text-align: center;
    font-size: 0.88rem; font-weight: 600; color: rgba(255,255,255,.55);
    cursor: pointer; border-bottom: 3px solid transparent;
    transition: all .15s;
  }
  .main-tab.active { color: #fff; border-bottom-color: #52b788; }

  .tab-page { display: none; }
  .tab-page.active { display: block; }

  .container { max-width: 700px; margin: 0 auto; padding: 16px; }

  .input-section {
    background: #fff;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 16px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
  }
  .input-section h2 { font-size: 1rem; margin-bottom: 12px; color: #2d6a4f; }

  .tag-input-wrap {
    border: 1.5px solid #ddd;
    border-radius: 8px;
    padding: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    cursor: text;
    min-height: 48px;
  }
  .tag-input-wrap:focus-within { border-color: #2d6a4f; }

  .tag {
    background: #d8f3dc;
    color: #1b4332;
    border-radius: 20px;
    padding: 3px 10px 3px 12px;
    font-size: 0.85rem;
    display: flex;
    align-items: center;
    gap: 4px;
    white-space: nowrap;
  }
  .tag button {
    background: none; border: none; cursor: pointer;
    color: #52b788; font-size: 0.9rem; line-height: 1; padding: 0;
  }
  .tag button:hover { color: #c0392b; }

  #ingredient-input {
    border: none; outline: none;
    font-size: 0.9rem; flex: 1; min-width: 120px;
    background: transparent;
  }

  .input-hint { font-size: 0.75rem; color: #888; margin-top: 6px; }

  .presets { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
  .preset-btn {
    background: #f0f7f4; border: 1px solid #b7e4c7;
    border-radius: 20px; padding: 4px 10px;
    font-size: 0.78rem; cursor: pointer; color: #2d6a4f;
    transition: background .15s;
  }
  .preset-btn:hover { background: #d8f3dc; }

  .generate-btn {
    width: 100%; margin-top: 14px;
    background: #2d6a4f; color: #fff;
    border: none; border-radius: 8px;
    padding: 13px; font-size: 1rem; font-weight: 600;
    cursor: pointer; transition: background .15s;
  }
  .generate-btn:hover { background: #1b4332; }

  .result-section { display: none; }
  .result-section.visible { display: block; }

  .week-nav {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 12px;
  }
  .week-nav h2 { font-size: 1rem; color: #1b4332; }
  .week-nav button {
    background: #2d6a4f; color: #fff; border: none;
    border-radius: 6px; padding: 6px 14px; font-size: 0.85rem;
    cursor: pointer;
  }

  .day-tabs {
    display: flex; gap: 4px; overflow-x: auto;
    padding-bottom: 4px; margin-bottom: 12px;
    scrollbar-width: none;
  }
  .day-tabs::-webkit-scrollbar { display: none; }

  .day-tab {
    flex-shrink: 0;
    background: #fff; border: 1.5px solid #ddd;
    border-radius: 8px; padding: 6px 12px;
    font-size: 0.82rem; cursor: pointer;
    transition: all .15s;
    white-space: nowrap;
  }
  .day-tab.active {
    background: #2d6a4f; border-color: #2d6a4f; color: #fff; font-weight: 600;
  }

  .day-card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    overflow: hidden;
  }

  .meal-row {
    display: flex; align-items: flex-start;
    padding: 14px 16px; border-bottom: 1px solid #f0f0f0;
    cursor: pointer;
    transition: background .12s;
  }
  .meal-row:last-child { border-bottom: none; }
  .meal-row:hover { background: #f9fef9; }
  .meal-row:active { background: #edf7f0; }

  .meal-content { flex: 1; }
  .meal-name {
    font-size: 0.95rem; font-weight: 600; margin-bottom: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .recipe-hint {
    font-size: 0.68rem; color: #52b788; font-weight: 400;
    border: 1px solid #b7e4c7; border-radius: 4px; padding: 1px 5px;
  }
  .meal-ingredients {
    font-size: 0.78rem; color: #666;
    display: flex; flex-wrap: wrap; gap: 4px;
  }
  .ingr-tag { background: #f4f4f4; border-radius: 4px; padding: 1px 6px; }
  .ingr-tag.match { background: #d8f3dc; color: #1b4332; }

  .meal-icon { font-size: 1.3rem; margin-right: 10px; flex-shrink: 0; }

  .coverage-bar {
    background: #fff; border-radius: 12px; padding: 12px 16px;
    margin-top: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.07);
    font-size: 0.82rem; color: #555;
  }
  .coverage-bar strong { color: #1b4332; }
  .bar-bg { background: #eee; border-radius: 20px; height: 6px; margin-top: 6px; }
  .bar-fill { background: #52b788; border-radius: 20px; height: 6px; transition: width .5s ease; }

  /* 레시피 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.45); z-index: 100;
    align-items: flex-end; justify-content: center;
  }
  .modal-overlay.open { display: flex; }

  .modal {
    background: #fff;
    border-radius: 20px 20px 0 0;
    width: 100%; max-width: 700px;
    max-height: 85vh; overflow-y: auto;
    padding-bottom: env(safe-area-inset-bottom, 16px);
    animation: slideUp .25s ease;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to   { transform: translateY(0); }
  }

  .modal-handle {
    width: 40px; height: 4px; background: #ddd;
    border-radius: 2px; margin: 12px auto 0;
  }

  .modal-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 16px 12px; border-bottom: 1px solid #f0f0f0;
  }
  .modal-title { display: flex; align-items: center; gap: 10px; }
  .modal-title .icon { font-size: 1.8rem; }
  .modal-title h3 { font-size: 1.1rem; font-weight: 700; }
  .meal-badge {
    font-size: 0.72rem; padding: 2px 8px;
    border-radius: 10px; font-weight: 600; display: inline-block;
    margin-bottom: 3px;
  }
  .badge-breakfast { background: #fef3e2; color: #e67e22; }
  .badge-lunch     { background: #e8f8ee; color: #27ae60; }
  .badge-dinner    { background: #e8f0fb; color: #2980b9; }

  .modal-close {
    background: #f4f4f4; border: none; border-radius: 50%;
    width: 32px; height: 32px; font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  }
  .modal-close:hover { background: #eee; }

  .modal-body { padding: 16px; }

  .recipe-section { margin-bottom: 20px; }
  .recipe-section h4 {
    font-size: 0.78rem; font-weight: 700; color: #888;
    text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px;
  }

  .recipe-ingr-list { display: flex; flex-wrap: wrap; gap: 6px; }
  .recipe-ingr-chip {
    background: #f4f4f4; border-radius: 6px; padding: 4px 10px; font-size: 0.84rem;
  }
  .recipe-ingr-chip.have { background: #d8f3dc; color: #1b4332; }

  /* 나의 레시피 탭 */
  .my-recipes-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 14px;
  }
  .my-recipes-header h2 { font-size: 1rem; color: #1b4332; }
  .add-recipe-btn {
    background: #2d6a4f; color: #fff; border: none;
    border-radius: 8px; padding: 8px 14px; font-size: 0.85rem;
    font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 5px;
  }
  .add-recipe-btn:hover { background: #1b4332; }

  .my-recipe-card {
    background: #fff; border-radius: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,.07);
    margin-bottom: 10px; overflow: hidden;
    cursor: pointer; transition: box-shadow .15s;
  }
  .my-recipe-card:hover { box-shadow: 0 3px 10px rgba(0,0,0,.1); }

  .my-recipe-card-head {
    display: flex; align-items: center;
    padding: 14px 16px; gap: 12px;
  }
  .my-recipe-icon { font-size: 1.5rem; flex-shrink: 0; }
  .my-recipe-info { flex: 1; }
  .my-recipe-name { font-size: 0.95rem; font-weight: 700; margin-bottom: 3px; }
  .my-recipe-meta { font-size: 0.75rem; color: #999; }
  .my-recipe-del {
    background: none; border: none; color: #ccc; font-size: 1.1rem;
    cursor: pointer; padding: 4px; flex-shrink: 0;
  }
  .my-recipe-del:hover { color: #e74c3c; }

  .empty-my-recipes {
    text-align: center; padding: 50px 20px; color: #bbb;
  }
  .empty-my-recipes .big { font-size: 2.5rem; margin-bottom: 10px; }
  .empty-my-recipes p { font-size: 0.9rem; }

  /* 레시피 입력 모달 */
  .form-group { margin-bottom: 16px; }
  .form-group label {
    display: block; font-size: 0.78rem; font-weight: 700;
    color: #555; margin-bottom: 6px; text-transform: uppercase; letter-spacing: .04em;
  }
  .form-input, .form-textarea {
    width: 100%; border: 1.5px solid #ddd; border-radius: 8px;
    padding: 10px 12px; font-size: 0.9rem; font-family: inherit;
    outline: none; transition: border-color .15s;
    background: #fff;
  }
  .form-input:focus, .form-textarea:focus { border-color: #2d6a4f; }
  .form-textarea { min-height: 100px; resize: vertical; line-height: 1.5; }
  .form-hint { font-size: 0.73rem; color: #aaa; margin-top: 4px; }
  .icon-picker { display: flex; flex-wrap: wrap; gap: 6px; }
  .icon-opt {
    font-size: 1.3rem; padding: 6px 8px; border-radius: 8px;
    cursor: pointer; border: 2px solid transparent; transition: all .1s;
  }
  .icon-opt:hover { background: #f0f7f4; }
  .icon-opt.selected { border-color: #2d6a4f; background: #d8f3dc; }
  .form-actions {
    display: flex; gap: 8px; margin-top: 4px;
  }
  .btn-cancel {
    flex: 1; padding: 12px; border: 1.5px solid #ddd;
    border-radius: 8px; background: #fff; font-size: 0.9rem;
    cursor: pointer; font-weight: 600; color: #555;
  }
  .btn-save {
    flex: 2; padding: 12px; border: none;
    border-radius: 8px; background: #2d6a4f; color: #fff;
    font-size: 0.9rem; cursor: pointer; font-weight: 600;
  }
  .btn-save:hover { background: #1b4332; }
  .recipe-ingr-chip.optional { opacity: .65; }

  .steps-list { list-style: none; }
  .steps-list li { display: flex; gap: 12px; margin-bottom: 12px; align-items: flex-start; }
  .step-num {
    flex-shrink: 0; width: 24px; height: 24px;
    background: #2d6a4f; color: #fff; border-radius: 50%;
    font-size: 0.75rem; font-weight: 700;
    display: flex; align-items: center; justify-content: center; margin-top: 1px;
  }
  .step-text { font-size: 0.88rem; line-height: 1.55; color: #333; }

  .recipe-tip {
    background: #f0f7f4; border-left: 3px solid #52b788;
    border-radius: 0 8px 8px 0; padding: 10px 12px;
    font-size: 0.82rem; color: #555; line-height: 1.5;
  }
  .recipe-tip strong { color: #2d6a4f; }
</style>
</head>
<body>

<header>
  <h1>🥗 냉장고 식단표</h1>
  <p>재료를 입력하면 1주일 식단을 자동으로 구성해드립니다</p>
</header>

<nav class="main-tabs">
  <div class="main-tab active" onclick="switchTab('planner')">📅 식단 생성</div>
  <div class="main-tab" onclick="switchTab('myrecipes')">📖 나의 레시피</div>
</nav>

<!-- 식단 생성 탭 -->
<div class="tab-page active" id="tab-planner">
<div class="container">
  <div class="input-section">
    <h2>냉장고 재료</h2>
    <div class="tag-input-wrap" id="tag-wrap" onclick="document.getElementById('ingredient-input').focus()">
      <input id="ingredient-input" placeholder="재료 입력 후 엔터" autocomplete="off">
    </div>
    <p class="input-hint">쉼표(,)나 엔터로 여러 재료를 입력하세요</p>

    <div class="presets">
      <span style="font-size:0.78rem;color:#888;align-self:center;">빠른 추가:</span>
      <button class="preset-btn" onclick="addPreset('달걀')">달걀</button>
      <button class="preset-btn" onclick="addPreset('두부')">두부</button>
      <button class="preset-btn" onclick="addPreset('닭가슴살')">닭가슴살</button>
      <button class="preset-btn" onclick="addPreset('돼지고기')">돼지고기</button>
      <button class="preset-btn" onclick="addPreset('소고기')">소고기</button>
      <button class="preset-btn" onclick="addPreset('양파')">양파</button>
      <button class="preset-btn" onclick="addPreset('감자')">감자</button>
      <button class="preset-btn" onclick="addPreset('당근')">당근</button>
      <button class="preset-btn" onclick="addPreset('시금치')">시금치</button>
      <button class="preset-btn" onclick="addPreset('버섯')">버섯</button>
      <button class="preset-btn" onclick="addPreset('고구마')">고구마</button>
      <button class="preset-btn" onclick="addPreset('파')">파</button>
      <button class="preset-btn" onclick="addPreset('마늘')">마늘</button>
      <button class="preset-btn" onclick="addPreset('쌀')">쌀</button>
      <button class="preset-btn" onclick="addPreset('라면')">라면</button>
      <button class="preset-btn" onclick="addPreset('김치')">김치</button>
      <button class="preset-btn" onclick="addPreset('우유')">우유</button>
      <button class="preset-btn" onclick="addPreset('치즈')">치즈</button>
    </div>

    <button class="generate-btn" onclick="generate()">식단 생성하기</button>
  </div>

  <div class="result-section" id="result">
    <div class="week-nav">
      <h2>이번 주 식단</h2>
      <button onclick="generate()">다시 생성</button>
    </div>
    <div class="day-tabs" id="day-tabs"></div>
    <div class="day-card" id="day-card"></div>
    <div class="coverage-bar" id="coverage-bar"></div>
  </div>
</div>
</div>

<!-- 나의 레시피 탭 -->
<div class="tab-page" id="tab-myrecipes">
<div class="container">
  <div class="my-recipes-header">
    <h2>나의 레시피</h2>
    <button class="add-recipe-btn" onclick="openAddRecipe()">+ 레시피 추가</button>
  </div>
  <div id="my-recipe-list"></div>
</div>
</div>

<!-- 레시피 모달 -->
<div class="modal-overlay" id="modal-overlay" onclick="closeModal(event)">
  <div class="modal" id="modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon" id="modal-icon"></span>
        <div>
          <div id="modal-badge"></div>
          <h3 id="modal-name"></h3>
        </div>
      </div>
      <button class="modal-close" onclick="closeModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
  </div>
</div>

<!-- 레시피 추가/보기 모달 -->
<div class="modal-overlay" id="my-modal-overlay" onclick="closeMyModal(event)">
  <div class="modal" id="my-modal">
    <div class="modal-handle"></div>
    <div class="modal-header">
      <div class="modal-title">
        <span class="icon" id="my-modal-icon">🍽️</span>
        <div>
          <h3 id="my-modal-title">레시피 추가</h3>
        </div>
      </div>
      <button class="modal-close" onclick="closeMyModalDirect()">✕</button>
    </div>
    <div class="modal-body" id="my-modal-body"></div>
  </div>
</div>

<script>
const RECIPES = [
  // 아침
  { name: '달걀 프라이', icon: '🍳', meal: 'breakfast', need: ['달걀'], optional: ['버터', '파'],
    steps: ['프라이팬에 식용유(또는 버터)를 두르고 중불로 달굽니다.', '달걀을 깨서 팬에 넣습니다.', '흰자가 익으면 뚜껑을 덮고 30초 더 익힙니다.', '소금·후추로 간하고 파를 뿌려 마무리합니다.'],
    tip: '반숙을 원하면 노른자가 살짝 흔들릴 때 불을 끄세요.' },
  { name: '스크램블 에그', icon: '🥚', meal: 'breakfast', need: ['달걀'], optional: ['우유', '치즈'],
    steps: ['달걀 2개에 우유 2큰술을 넣고 잘 풀어줍니다.', '버터를 두른 팬에 달걀물을 붓습니다.', '약불에서 주걱으로 천천히 저어가며 익힙니다.', '치즈를 올리고 불을 끄면 여열로 완성됩니다.'],
    tip: '약불+천천히 젓기가 부드러운 스크램블의 핵심입니다.' },
  { name: '토스트 & 달걀', icon: '🍞', meal: 'breakfast', need: ['달걀', '식빵'], optional: ['치즈', '버터'],
    steps: ['식빵을 토스터에 굽습니다.', '팬에 버터를 녹이고 달걀 프라이를 만듭니다.', '토스트 위에 치즈 → 달걀 순으로 올립니다.', '소금·후추로 마무리합니다.'],
    tip: '치즈는 달걀 위에 올린 뒤 뚜껑을 덮으면 잘 녹습니다.' },
  { name: '고구마 죽', icon: '🍠', meal: 'breakfast', need: ['고구마', '쌀'], optional: [],
    steps: ['쌀을 30분 불려둡니다.', '고구마는 껍질 벗겨 작게 깍둑썰기합니다.', '냄비에 쌀·고구마·물(5배)을 넣고 끓입니다.', '약불에서 20분간 저으며 걸쭉해질 때까지 익힙니다.', '소금으로 간합니다.'],
    tip: '고구마를 미리 쪄두면 훨씬 빠르게 완성됩니다.' },
  { name: '시리얼 & 우유', icon: '🥣', meal: 'breakfast', need: ['우유'], optional: [],
    steps: ['그릇에 시리얼을 담습니다.', '차가운 우유를 붓습니다.'],
    tip: '바나나나 블루베리를 얹으면 영양이 풍부해집니다.' },
  { name: '두부 계란찜', icon: '🥘', meal: 'breakfast', need: ['두부', '달걀'], optional: ['파'],

const DAYS = ['월요일', '화요일', '수요일', '목요일', '금요일', '토요일', '일요일'];

// ── 태그 입력 (한국어 IME 대응) ──
let ingredients = [];
let composing = false;

const input = document.getElementById('ingredient-input');

input.addEventListener('compositionstart', () => { composing = true; });
input.addEventListener('compositionend',   () => { composing = false; });

input.addEventListener('keydown', e => {
  if (e.key === 'Backspace' && input.value === '' && ingredients.length) {
    removeIngredient(ingredients[ingredients.length - 1]);
  }
});

// keyup으로 엔터 처리 — IME 조합이 완전히 끝난 뒤 발생함
input.addEventListener('keyup', e => {
  if (e.key === 'Enter' && !composing) {
    const val = input.value.trim();
    if (val) addIngredient(val);
  }
});

input.addEventListener('input', () => {
  if (composing) return;
  if (input.value.includes(',')) {
    const parts = input.value.split(',');
    parts.slice(0, -1).forEach(v => { if (v.trim()) addIngredient(v.trim()); });
    input.value = parts[parts.length - 1];
  }
});

function addIngredient(val) {
  val = val.trim().replace(/,/g, '');
  if (!val || ingredients.includes(val)) { input.value = ''; return; }
  ingredients.push(val);
  renderTags();
  input.value = '';
}

function addPreset(val) { addIngredient(val); }

function removeIngredient(val) {
  ingredients = ingredients.filter(i => i !== val);
  renderTags();
}

function renderTags() {
  const wrap = document.getElementById('tag-wrap');
  wrap.querySelectorAll('.tag').forEach(t => t.remove());
  ingredients.forEach(ing => {
    const tag = document.createElement('span');
    tag.className = 'tag';
    const safe = ing.replace(/'/g, '&#39;');
    tag.innerHTML = `${ing}<button onclick="removeIngredient('${safe}')" title="삭제">×</button>`;
    wrap.insertBefore(tag, input);
  });
}

// ── 식단 생성 ──
let plan = [];
let activeDay = 0;

function score(recipe, ingrs) {
  const lc = ingrs.map(i => i.toLowerCase());
  let s = 0;
  recipe.need.forEach(n => { if (lc.some(i => i.includes(n) || n.includes(i))) s += 3; });
  recipe.optional.forEach(n => { if (lc.some(i => i.includes(n) || n.includes(i))) s += 1; });
  return s;
}

function pickRecipe(meal, ingrs, usedNames) {
  const pool = RECIPES.filter(r => r.meal === meal && !usedNames.has(r.name));
  if (!pool.length) return { ...FALLBACK[meal], matchedIngredients: [] };
  const scored = pool.map(r => ({ ...r, score: score(r, ingrs) }));
  scored.sort((a, b) => b.score - a.score);
  const top = scored[0].score;
  const topPool = scored.filter(r => r.score >= Math.max(top - 1, 0));
  const chosen = topPool[Math.floor(Math.random() * topPool.length)];
  const lc = ingrs.map(i => i.toLowerCase());
  const matched = [...chosen.need, ...chosen.optional].filter(n =>
    lc.some(i => i.includes(n) || n.includes(i))
  );
  return { ...chosen, matchedIngredients: matched };
}

function generate() {
  if (ingredients.length === 0) { alert('재료를 하나 이상 입력해주세요!'); return; }
  plan = [];
  const usedNames = { breakfast: new Set(), lunch: new Set(), dinner: new Set() };
  for (let d = 0; d < 7; d++) {
    const day = {};
    MEALS.forEach(m => {
      const r = pickRecipe(m, ingredients, usedNames[m]);
      if (usedNames[m].size < RECIPES.filter(x => x.meal === m).length - 1) usedNames[m].add(r.name);
      day[m] = r;
    });
    plan.push(day);
  }
  activeDay = 0;
  renderResult();
}

function renderResult() {
  document.getElementById('result').classList.add('visible');
  renderTabs();
  renderDayCard(activeDay);
  renderCoverage();
  document.getElementById('result').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function renderTabs() {
  const wrap = document.getElementById('day-tabs');
  wrap.innerHTML = '';
  DAYS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'day-tab' + (i === activeDay ? ' active' : '');
    btn.textContent = d;
    btn.onclick = () => { activeDay = i; renderTabs(); renderDayCard(i); };
    wrap.appendChild(btn);
  });
}

function renderDayCard(idx) {
  const card = document.getElementById('day-card');
  const dayPlan = plan[idx];
  card.innerHTML = MEALS.map(m => {
    const r = dayPlan[m];
    const allIngr = [...(r.need || []), ...(r.optional || [])];
    const matched = r.matchedIngredients || [];
    const ingrHtml = allIngr.length
      ? allIngr.map(n => {
          const isMatch = matched.includes(n);
          return `<span class="ingr-tag${isMatch ? ' match' : ''}">${n}</span>`;
        }).join('')
      : '<span class="ingr-tag">기본 재료</span>';
    const rId = encodeURIComponent(r.name);
    return `<div class="meal-row" onclick="openRecipe('${rId}','${m}')">
      <div class="meal-icon">${r.icon}</div>
      <div class="meal-content">
        <div style="font-size:0.7rem;color:#aaa;margin-bottom:2px;">${MEAL_LABEL[m]}</div>
        <div class="meal-name">${r.name} <span class="recipe-hint">레시피 보기</span></div>
        <div class="meal-ingredients">${ingrHtml}</div>
      </div>
    </div>`;
  }).join('');
}

function renderCoverage() {
  const bar = document.getElementById('coverage-bar');
  const allRecipeIngredients = new Set(plan.flatMap(d => MEALS.flatMap(m => d[m].matchedIngredients || [])));
  const matched = ingredients.filter(ing =>
    [...allRecipeIngredients].some(r => r.includes(ing) || ing.includes(r))
  ).length;
  const pct = ingredients.length ? Math.round(matched / ingredients.length * 100) : 0;
  bar.innerHTML = `
    <strong>재료 활용률 ${pct}%</strong> — 입력한 ${ingredients.length}개 재료 중 ${matched}개가 이번 주 식단에 사용돼요
    <div class="bar-bg"><div class="bar-fill" style="width:${pct}%"></div></div>
  `;
}

// ── 레시피 모달 ──
function openRecipe(nameEncoded, meal) {
  const name = decodeURIComponent(nameEncoded);
  const recipe = RECIPES.find(r => r.name === name) || FALLBACK[meal];
  if (!recipe) return;

  document.getElementById('modal-icon').textContent = recipe.icon;
  document.getElementById('modal-name').textContent = recipe.name;

  const badgeClass = { breakfast: 'badge-breakfast', lunch: 'badge-lunch', dinner: 'badge-dinner' };
  document.getElementById('modal-badge').innerHTML =
    `<span class="meal-badge ${badgeClass[meal]}">${MEAL_LABEL[meal]}</span>`;

  const myIngredients = ingredients.map(i => i.toLowerCase());
  const allIngr = [...(recipe.need || []), ...(recipe.optional || [])];
  const ingrHtml = allIngr.length ? allIngr.map(n => {
    const have = myIngredients.some(i => i.includes(n) || n.includes(i));
    const isOpt = (recipe.optional || []).includes(n);
    return `<span class="recipe-ingr-chip${have ? ' have' : ''}${isOpt ? ' optional' : ''}">${n}${have ? ' ✓' : ''}${isOpt ? ' (선택)' : ''}</span>`;
  }).join('') : '<span class="recipe-ingr-chip">기본 재료</span>';

  const stepsHtml = (recipe.steps || []).map((s, i) =>
    `<li><span class="step-num">${i + 1}</span><span class="step-text">${s}</span></li>`
  ).join('');

  const tipHtml = recipe.tip
    ? `<div class="recipe-section"><h4>요리 팁</h4><div class="recipe-tip"><strong>💡 </strong>${recipe.tip}</div></div>`
    : '';

  document.getElementById('modal-body').innerHTML = `
    <div class="recipe-section">
      <h4>필요 재료</h4>
      <div class="recipe-ingr-list">${ingrHtml}</div>
    </div>
    <div class="recipe-section">
      <h4>조리 순서</h4>
      <ol class="steps-list">${stepsHtml}</ol>
    </div>
    ${tipHtml}
  `;

  document.getElementById('modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal(e) {

  document.getElementById('my-modal-body').innerHTML = `
    <div style="display:flex;gap:8px;margin-bottom:16px;">
      <button class="btn-cancel" style="flex:1" onclick="editMyRecipe('${r.id}')">✏️ 수정</button>
    </div>
    <div class="recipe-section">
      <h4>재료</h4>
      <div class="recipe-ingr-list">${ingrHtml}</div>
    </div>
    <div class="recipe-section">
      <h4>조리 순서</h4>
      <ol class="steps-list">${stepsHtml}</ol>
    </div>
    ${tipHtml}
  `;

  document.getElementById('my-modal-overlay').classList.add('open');
  document.body.style.overflow = 'hidden';
}

function editMyRecipe(id) {
  const r = myRecipes.find(x => x.id === id);
  if (!r) return;
  editingId = id;
  document.getElementById('my-modal-title').textContent = '레시피 수정';
  renderRecipeForm(r);
}

function renderRecipeForm(r) {
  const selectedIcon = r ? r.icon : '🍳';
  const iconsHtml = ICONS.map(ic =>
    `<span class="icon-opt${ic === selectedIcon ? ' selected' : ''}" onclick="selectIcon(this,'${ic}')">${ic}</span>`
  ).join('');

  document.getElementById('my-modal-body').innerHTML = `
    <div class="form-group">
      <label>아이콘</label>
      <div class="icon-picker">${iconsHtml}</div>
    </div>
    <div class="form-group">
      <label>요리 이름</label>
      <input class="form-input" id="form-name" placeholder="예: 된장찌개" value="${r ? r.name : ''}">
    </div>
    <div class="form-group">
      <label>재료</label>
      <textarea class="form-textarea" id="form-ingredients" placeholder="한 줄에 재료 하나씩 입력&#10;예: 두부 1/2모&#10;양파 1/2개">${r ? r.ingredients : ''}</textarea>
    </div>
    <div class="form-group">
      <label>조리 순서</label>
      <textarea class="form-textarea" id="form-steps" placeholder="한 줄에 단계 하나씩 입력&#10;예: 두부를 깍둑썰기합니다.&#10;팬에 기름을 두릅니다.">${r ? r.steps : ''}</textarea>
    </div>
    <div class="form-group">
      <label>메모 / 팁 (선택)</label>
      <input class="form-input" id="form-tip" placeholder="예: 묵은 김치를 쓰면 더 맛있어요" value="${r ? (r.tip || '') : ''}">
    </div>
    <div class="form-actions">
      <button class="btn-cancel" onclick="closeMyModalDirect()">취소</button>
      <button class="btn-save" onclick="saveRecipeForm()">저장하기</button>
    </div>
  `;
}

let selectedIconValue = '🍳';
function selectIcon(el, icon) {
  document.querySelectorAll('#my-modal-body .icon-opt').forEach(e => e.classList.remove('selected'));
  el.classList.add('selected');
  selectedIconValue = icon;
  document.getElementById('my-modal-icon').textContent = icon;
}

function saveRecipeForm() {
  const name = document.getElementById('form-name').value.trim();
  if (!name) { alert('요리 이름을 입력해주세요.'); return; }
  const icon = selectedIconValue || '🍳';
  const ingredients = document.getElementById('form-ingredients').value.trim();
  const steps = document.getElementById('form-steps').value.trim();
  const tip = document.getElementById('form-tip').value.trim();

  if (editingId) {
    const idx = myRecipes.findIndex(r => r.id === editingId);
    if (idx !== -1) myRecipes[idx] = { ...myRecipes[idx], name, icon, ingredients, steps, tip };
  } else {
    myRecipes.unshift({ id: Date.now().toString(), name, icon, ingredients, steps, tip });
  }
  saveMyRecipes();
  closeMyModalDirect();
  renderMyRecipes();
}

function deleteMyRecipe(id) {
  if (!confirm('이 레시피를 삭제할까요?')) return;
  myRecipes = myRecipes.filter(r => r.id !== id);
  saveMyRecipes();
  renderMyRecipes();
}

function closeMyModal(e) {
  if (e.target === document.getElementById('my-modal-overlay')) closeMyModalDirect();
}
function closeMyModalDirect() {
  document.getElementById('my-modal-overlay').classList.remove('open');
  document.body.style.overflow = '';
}

// ── 서비스워커 등록 ──
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js');
  });
}
</script>
</body>
</html>
